name: paints-by-numbers

services:
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "${TOKAMAKI_BIND_ADDRESS:-127.0.0.1}:${TOKAMAKI_HTTP_PORT:-8081}:80"
    restart: unless-stopped
    depends_on:
      - php
    volumes:
      - poster-media:/var/www/html/public/storage:ro

  php:
    build: ./apps/web
    environment: &web-environment
      APP_NAME: Paints by Numbers
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY must be set in the root .env file}
      APP_URL: ${APP_URL:-https://tokamaki.ru}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: paints
      DB_USERNAME: paints
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the root .env file}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      DB_QUEUE_RETRY_AFTER: 1000
      GENERATOR_URL: http://generator:8000
      GENERATOR_TIMEOUT: 360
      FILAMENT_ADMIN_EMAIL: ${FILAMENT_ADMIN_EMAIL:-}
      FILAMENT_ADMIN_PASSWORD: ${FILAMENT_ADMIN_PASSWORD:-}
      CATALOG_API_TOKEN: ${CATALOG_API_TOKEN:?CATALOG_API_TOKEN must be set in the root .env file}
      MOCKUP_CATALOG_URL: ${MOCKUP_CATALOG_URL:-https://mockup.n8n-team.ru}
      MOCKUP_CATALOG_TOKEN: ${MOCKUP_CATALOG_TOKEN:?MOCKUP_CATALOG_TOKEN must be set in the root .env file}
      AITUNNEL_API_KEY: ${AITUNNEL_API_KEY:-}
      AITUNNEL_API_URL: ${AITUNNEL_API_URL:-https://api.aitunnel.ru/v1/chat/completions}
      AITUNNEL_POSTER_MODEL: ${AITUNNEL_POSTER_MODEL:-qwen3.7-flash}
      AITUNNEL_TIMEOUT: ${AITUNNEL_TIMEOUT:-120}
      INDEXNOW_ENDPOINT: ${INDEXNOW_ENDPOINT:-https://yandex.com/indexnow}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-tokamaki-1c8f72e6a4b945e3b8d2f0a769c4315e}
      POSTER_PRICE_30X40: ${POSTER_PRICE_30X40:-990}
      POSTER_PRICE_40X50: ${POSTER_PRICE_40X50:-1290}
    command: sh -c "php artisan migrate --force && php artisan db:seed --class=AdminUserSeeder --force && php-fpm"
    restart: unless-stopped
    volumes:
      - poster-media:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy
      generator:
        condition: service_started

  queue:
    build: ./apps/web
    environment: *web-environment
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=900
    restart: unless-stopped
    volumes:
      - poster-media:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build: ./apps/web
    environment: *web-environment
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  generator:
    build:
      context: .
      dockerfile: services/generator/Dockerfile
    init: true
    environment:
      GENERATOR_MAX_PROCESSING_SIDE: ${GENERATOR_MAX_PROCESSING_SIDE:-900}
    restart: unless-stopped
    volumes:
      - generator-results:/app/data/results

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paints
      POSTGRES_USER: paints
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the root .env file}
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paints -d paints"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  generator-results:
  poster-media:
  postgres-data:
  redis-data:
