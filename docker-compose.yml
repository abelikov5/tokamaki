name: paints-by-numbers

services:
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "${TOKAMAKI_BIND_ADDRESS:-127.0.0.1}:${TOKAMAKI_HTTP_PORT:-8081}:80"
    restart: unless-stopped
    depends_on:
      - php

  php:
    build: ./apps/web
    environment:
      APP_NAME: Paints by Numbers
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY must be set in the root .env file}
      APP_URL: ${APP_URL:-https://tokamaki.ru}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: paints
      DB_USERNAME: paints
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the root .env file}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      GENERATOR_URL: http://generator:8000
      GENERATOR_TIMEOUT: 360
    command: sh -c "php artisan migrate --force && php-fpm"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      generator:
        condition: service_started

  generator:
    build: ./services/generator
    init: true
    restart: unless-stopped
    volumes:
      - generator-results:/app/data/results

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paints
      POSTGRES_USER: paints
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in the root .env file}
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paints -d paints"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  generator-results:
  postgres-data:
  redis-data:
