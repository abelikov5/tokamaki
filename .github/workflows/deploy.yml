name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tokamaki-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy current main revision
        run: |
          ssh -i ~/.ssh/id_ed25519 tokamaki-deploy@77.222.54.42 \
            'cd /opt/tokamaki && git fetch origin main && git checkout main && git reset --hard origin/main && ./scripts/deploy.sh'
